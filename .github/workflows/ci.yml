name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: ci-only-secret-do-not-use-in-prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install system dependencies (OCR fallback)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-fra

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Start service containers
        run: docker compose up -d --wait

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q

      - name: Start a real Celery worker (separate process from this CI step)
        run: |
          celery -A app.tasks.celery_app worker --loglevel=info --pool=solo &
          echo $! > celery_worker.pid
          for i in $(seq 1 20); do
            celery -A app.tasks.celery_app inspect ping -t 2 && break
            sleep 1
          done

      - name: Dispatch a real task end-to-end (fails with NotRegistered if registration breaks)
        run: |
          python -c "
          from app.tasks.gdpr_tasks import nettoyer_entites_orphelines_task
          removed = nettoyer_entites_orphelines_task.delay().get(timeout=10)
          print(f'Task executed successfully by the worker, removed={removed}')
          "

      - name: Stop Celery worker
        if: always()
        run: kill "$(cat celery_worker.pid)" 2>/dev/null || true

      - name: Stop service containers
        if: always()
        run: docker compose down -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install lint tools
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t nexustalent-api:ci .
